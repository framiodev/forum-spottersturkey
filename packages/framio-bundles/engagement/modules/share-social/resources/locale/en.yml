framio-share-social: &share_social_en
  admin:
    settings:
      canonical-urls: Use canonical URLs for sharing
      plain-copy: Display plain URL copy
      default-option: Default share option
      default-option-help: |
        Choosing a default option will convert the modal into a dropdown button.
        If "Native Share" is selected, it will only be shown if the browser supports it, otherwise behavior reverts to original modal.
      networks-heading: Enabled Social Networks & Messengers
      custom-networks: Custom Networks & Share Links
      custom-networks-help: |
        Add your own custom platforms here, one per line, using this format:
        Platform Name | Icon Class | Share URL Template | Button Color (Optional Hex)

        Supported variables: {url}, {title}, {description}

        Examples:
        Discord | fa-brands fa-discord | https://discord.com/channels/@me?content={title}%20{url} | #5865F2
        Signal | fas fa-comment-dots | sgnl://share?text={title}%20{url} | #3A76F0
      custom-networks-placeholder: "Discord | fa-brands fa-discord | https://discord.com/... | #5865F2"

  forum:
    discussion:
      share_button: Share
      share_dropdown_accessible_label: Toggle discussion share dropdown menu
    modal:
      title: Share
      copy_button: Copy

  lib:
    networks:
      whatsapp: WhatsApp
      telegram: Telegram
      linkedin: LinkedIn
      twitter: X (formerly Twitter)
      facebook: Facebook
      reddit: Reddit
      threads: Threads
      bluesky: Bluesky
      mastodon: Mastodon
      pinterest: Pinterest
      tumblr: Tumblr
      viber: Viber
      skype: Skype
      email: Email
      native: Native Share
      vkontakte: VKontakte
      odnoklassniki: Odnoklassniki
      my_mail: My World
      qq: QQ
      qzone: QZone

