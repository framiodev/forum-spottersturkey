fof-move-posts:
  admin:
    settings:
      moved_first_post_content: 'Taşınan Tartışmanın (İlk Gönderi) İçeriği'
      moved_first_post_content_help: >
        Yalnızca tek bir gönderisi olan bir tartışmada o gönderi taşındığında, ilk tartışmanın ilk gönderisi yeni tartışmaya yönlendirecek şekilde düzenlenir.
        Bu gönderinin içeriğini buradan düzenleyebilirsiniz.
      group_sequential_posts: 'Ardışık gönderi taşındı olay gönderilerini tek bir gönderide grupla.'
    permissions:
      move_posts: '=> fof-move-posts.ref.move_posts'

  forum:
    badge:
      first_moved_tooltip: 'Taşındı'
    discussion:
      move_posts: '=> fof-move-posts.ref.move_posts'
    error:
      move_old_post_to_newer_discussion: '=> fof-move-posts.ref.status.old_to_new_move'
      move_posts_to_same_discussion: 'Gönderileri aynı tartışmaya taşıyamazsınız.'
    modal:
      check: 'İşlem Türünü Kontrol Et'
      destination: 'Hedef Tartışma'
      discussion_help: 'Kaynak tartışmanın etiketleri kullanılacak olup oluşturulduktan sonra değiştirilebilir.'
      discussion_name: '=> core.forum.composer_discussion.title_placeholder'
      new_discussion: 'Yeni Tartışma'
      selected_posts: '{count, plural, one {1 Gönderi Seçildi} other {{count} Gönderi Seçildi}}'
      status:
        complex_move: 'Karmaşık bir taşıma olacak; gönderiler araya eklenecektir, bu da hedef tartışmadaki eski URL referanslarının değişmesine neden olabilir.'
        old_to_new_move: '=> fof-move-posts.ref.status.old_to_new_move'
        simple_move: 'Basit bir taşıma olacak; gönderilerin tümü tartışmanın sonuna eklenecektir.'
      submit: 'Devam Et'
      title: '=> fof-move-posts.ref.move_posts'
      confirm_move_all_to_new_discussion: 'Bu tartışmadaki tüm gönderileri yeni bir tartışmaya taşımak üzeresiniz. Çoğu durumda, başlığını veya etiketlerini düzenlemek daha mantıklıdır. Yine de devam etmek istiyor musunuz?'
    alerts:
      posts_moved_to: '{count, plural, one {Gönderi {target_discussion} tartışmasına taşındı.} other {{count} gönderi {target_discussion} tartışmasına taşındı.}}'
    notifications:
      post_moved_text: 'Bir veya birden fazla gönderiniz {targetDiscussionTitle} tartışmasına taşındı.'
    post:
      unmove: 'Taşımaktan vazgeç'
      move: 'Taşımak için seç'
      moving: 'Gönderi Taşınıyor'
    post_stream:
      post_moved: '{count, plural, one {{username}, bir gönderiyi {target_discussion} tartışmasına taşıdı.} other {{username}, {count} gönderiyi {target_discussion} tartışmasına taşıdı.}}'

  ref:
    move_posts: 'Gönderileri Taşı'
    status:
      old_to_new_move: 'Eski bir gönderi daha yeni bir tartışmaya taşınamaz.'

  lib:
    discussion:
      first_post:
        default_content: >
          *Bu gönderi **[%DISCUSSION_NAME%](%POST_LINK%)** tartışmasına taşınmıştır.*

flarum-audit:
  lib:
    browser:
      posts:
        moved: 'gönderileri taşıdı'
        moved_to_new_discussion: 'gönderileri yeni bir tartışmaya taşıdı'
