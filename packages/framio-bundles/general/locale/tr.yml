      title: "Kesintisiz Varlık Yenileme (Seamless Refresh)"
      description: "Flarum 2.0 çekirdeğinde varlıklar (JS/CSS) veya önbellek güncellendiğinde çıkan rahatsız edici 'Sayfayı yenileyin' bildirimlerini ortadan kaldırır. Kullanıcılar yazı yazarken veya okurken bölünmez; ilk sayfa geçişinde yeni varlıklar arka planda sessizce yüklenir."
