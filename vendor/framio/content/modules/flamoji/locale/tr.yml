        nature: => pianotell-flamoji.ref.emoji_categories.nature
        foods: => pianotell-flamoji.ref.emoji_categories.foods
        activity: => pianotell-flamoji.ref.emoji_categories.activity
        places: => pianotell-flamoji.ref.emoji_categories.places
        objects: => pianotell-flamoji.ref.emoji_categories.objects
        symbols: => pianotell-flamoji.ref.emoji_categories.symbols
