      pick: Bir emoji seçin
      add_custom: Özel emoji ekle
      category_search: Arama Sonuçları
      skin_tone_choose: Varsayılan ten rengini seçin
      skin_tone_default: Varsayılan
      skin_tone_light: Açık
      skin_tone_medium_light: Orta-Açık
      skin_tone_medium: Orta
      skin_tone_medium_dark: Orta-Koyu
      skin_tone_dark: Koyu

