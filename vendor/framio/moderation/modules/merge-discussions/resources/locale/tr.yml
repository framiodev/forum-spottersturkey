fof-merge-discussions:
  forum:
    modal:
      title: "Tartışmaları Birleştir"
      search_discussions_placeholder: "Tartışma ara..."

      ordering_heading: "Birleştirme Sıralaması"
      ordering_date_label: "Gönderileri oluşturulma tarihine göre sırala"
      ordering_date_help: "Birleştirilen konudaki gönderiler, her birinin kendi oluşturulma tarihine göre kronolojik sıraya dizilir."
      ordering_suffix_label: "Birleştirilen gönderileri konunun sonuna ekle"
      ordering_suffix_help: "Birleştirilen konunun gönderileri ana konunun en sonuna eklenir."

      type_heading: "Birleştirme Yönü"
      type_target_label: "Bu konuya birleştir (Hedef burası)"
      type_target_help_text: "{title} konusuna eklenecek diğer tartışmaları seçin."

      type_from_label: "Bu konuyu başka bir konuya birleştir"
      type_from_help_text: "{title} konusunun aktarılacağı hedef tartışmayı seçin."

      load_preview_button: "Önizleme"
      submit_button: => fof-merge-discussions.ref.merge

    notification:
      discussion_merged: "{oldTitle} başlıklı tartışmanız {username} tarafından bu konuyla birleştirildi."
      preferences:
        discussion_merged: "Biri açtığım bir tartışmayı başka bir tartışmayla birleştirdiğinde"

    discussion:
      merge: => fof-merge-discussions.ref.merge

    post:
      merged: "{count, plural, one {{titles} konusundan 1 gönderi birleştirildi.} other {{titles} konusundan {count} gönderi birleştirildi.}}"

  admin:
    permissions:
      merge_discussions_label: "Tartışmaları birleştir"
    settings:
      search_result_help: "Tartışmaları Birleştir modalında arama yapılırken listelenecek maksimum tartışma sayısı."
      search_result_label: "Arama Sonucu Limiti"

  api:
    error:
      merging_failed: "Tartışmalar birleştirilemedi."
      updating_failed: "Tartışma detayları güncellenemedi."
      deleting_failed: "Boşalan tartışmalar silinemedi."
      fixing_posts_number_failed: "Gönderi numaraları düzeltilemedi."
      fixing_posts_number_meta_failed: "Gönderi numaraları meta verisi düzeltilemedi."

  ref:
    merge: "Birleştir"

  email:
    merged:
      body: |
        Merhaba,

        "{merged_discussion_title}" başlıklı tartışmanız {actor_display_name} tarafından "{discussion_title}" konusuyla birleştirildi.

        Birleştirilen konuyu buradan inceleyebilirsiniz:
        {discussion_url}
      subject: '"{merged_discussion_title}" başlıklı tartışmanız birleştirildi'

flarum-audit:
  lib:
    browser:
      discussion:
        merged_away: "{discussion} konusu {new_discussion} konusuna birleştirildi"
        merged_into: "{original_discussion_ids_count} konudan {post_count} gönderi {discussion} konusuna birleştirildi"
